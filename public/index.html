<!DOCTYPE html>
<html lang="nl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Terugbelverzoek – Zwembad Dijnselburg</title>
    <style>
      :root {
        --bg: #f3f7ff;
        --panel: #ffffff;
        --primary: #0f4c81;
        --primary-dark: #0b3d68;
        --text: #1f2937;
        --muted: #64748b;
        --border: #dbe4f1;
      }

      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: Arial, Helvetica, sans-serif;
        background: linear-gradient(180deg, #edf5ff 0%, #f8fbff 100%);
        color: var(--text);
      }
      .container {
        max-width: 760px;
        margin: 64px auto;
        padding: 24px;
      }
      .panel {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 20px;
        padding: 32px;
        box-shadow: 0 18px 40px rgba(15, 76, 129, 0.08);
      }
      .brand {
        display: flex;
        justify-content: center;
        margin-bottom: 18px;
      }
      .brand img {
        display: block;
        width: min(100%, 260px);
        height: auto;
      }
      p {
        margin: 0 0 24px;
        color: var(--muted);
        line-height: 1.6;
      }
      .qr-wrap {
        display: flex;
        justify-content: center;
        margin: 24px 0 32px;
        padding: 18px;
        background: #f8fbff;
        border-radius: 16px;
        border: 1px solid var(--border);
      }
      .qr-wrap img {
        display: block;
        width: min(100%, 360px);
        height: auto;
        background: #fff;
        border-radius: 12px;
        padding: 20px;
      }
      .actions {
        display: flex;
        justify-content: center;
        margin-top: 16px;
      }
      .button {
        display: inline-block;
        background: var(--primary);
        color: #fff;
        border: none;
        border-radius: 999px;
        padding: 14px 24px;
        text-decoration: none;
        font-weight: 700;
        cursor: pointer;
      }
      .button:hover {
        background: var(--primary-dark);
      }
    </style>
  </head>
  <body>
    <main class="container">
      <section class="panel">
        <div class="brand" aria-label="SRO Zeist logo">
          <img src="/sro-zeist-logo.png" alt="SRO Zeist" />
        </div>

        <p>
          Scan de QR-code om direct een terugbelverzoek in te vullen voor vragen over de zwemlessen van uw kind.
        </p>

        <div class="qr-wrap">
          <img src="/qr" alt="QR-code voor contactformulier" />
        </div>

        <div class="actions">
          <a class="button" href="/contact">Open het contactformulier</a>
        </div>
      </section>
    </main>
  </body>
</html>
